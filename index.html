<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Karakuri AR - Minimal Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- Core AR / A-Frame Scripts -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    embedded
    gesture-detector
  >

    <!-- Assets -->
    <a-assets>
      <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
    </a-assets>

    <!-- Marker and Model -->
    <a-marker
      id="animated-marker"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <a-entity
        id="metallic-model"
        gltf-model="#animated-asset"
        class="clickable"
        scale="0.1836 0.1836 0.1836"
        animation-mixer="loop: repeat"
        gesture-handler
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Pause/Play Button -->
  <button id="toggleAnimBtn" style="
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background-color: rgba(255,255,255,0.8);
    color: black;
    font-weight: bold;
  ">
    Pause Animation
  </button>

  <!-- Toggle Script -->
  <script>
    const toggleBtn = document.getElementById("toggleAnimBtn");
    const model = document.querySelector("#metallic-model");

    let isPaused = false;
    toggleBtn.addEventListener("click", () => {
      if (!model) return;
      if (isPaused) {
        model.setAttribute("animation-mixer", "timeScale: 1");
        toggleBtn.textContent = "Pause Animation";
      } else {
        model.setAttribute("animation-mixer", "timeScale: 0");
        toggleBtn.textContent = "Play Animation";
      }
      isPaused = !isPaused;
    });
  </script>
</body>
</html>
