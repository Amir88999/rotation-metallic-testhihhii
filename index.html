<a-scene
  vr-mode-ui="enabled: false;"
  loading-screen="enabled: false;"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
  embedded
  gesture-detector
>
  <a-assets>
    <a-asset-item id="animated-asset" src="https://cdn.aframe.io/test-models/models/glTF-Binary/Duck.glb"></a-asset-item>
  </a-assets>

  <a-marker
    preset="hiro"
    type="pattern"
    raycaster="objects: .clickable"
    emitevents="true"
    cursor="fuse: false; rayOrigin: mouse;"
  >
    <a-entity
      gltf-model="#animated-asset"
      scale="0.5 0.5 0.5"
      animation-mixer
      class="clickable"
      gesture-handler
    ></a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
